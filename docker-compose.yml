services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow
    volumes:
      - stockflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://stockflow:stockflow@db:5432/stockflow
      STOCKFLOW_AUTH_SECRET: replace-this-in-production
      STOCKFLOW_AUTO_CREATE_TABLES: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
volumes:
  stockflow-db:
